# ==========================================================
# BTC 全市场智能研究平台 - 站点配置（HTTP :80）
# 路由:
#   /                -> frontend:3000 (Next.js)
#   /api/            -> backend:8000 (FastAPI)
#   /ws              -> backend:8000 (WebSocket upgrade)
#   /health          -> backend:8000 (探活)
# SSL: 文末注释模板（Let's Encrypt / certbot）
# ==========================================================

server {
    listen 80;
    server_name _;

    # ---- 健康检查（供 LB / systemd / 监控探活，不重定向） ----
    location = /health {
        proxy_pass http://backend_up/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        access_log off;
    }

    # ---- API（REST；FastAPI 路由前缀 /api/v1 原样透传） ----
    location /api/ {
        proxy_pass http://backend_up;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host       $host;
        proxy_set_header X-Real-IP        $remote_addr;
        proxy_set_header X-Forwarded-For  $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_send_timeout    120s;
        proxy_read_timeout    120s;
        proxy_buffering off;
    }

    # ---- WebSocket（实时行情推送，长连接） ----
    location /ws {
        proxy_pass http://backend_up;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host       $host;
        proxy_set_header X-Real-IP        $remote_addr;
        proxy_set_header X-Forwarded-For  $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # WebSocket 长连接：24h 读超时
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        proxy_buffering off;
    }

    # ---- Next.js 静态资源（内容哈希，强缓存） ----
    location /_next/static/ {
        proxy_pass http://frontend_up;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # ---- 前端页面 ----
    location / {
        proxy_pass http://frontend_up;
        proxy_http_version 1.1;
        proxy_set_header Host       $host;
        proxy_set_header X-Real-IP        $remote_addr;
        proxy_set_header X-Forwarded-For  $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Next.js SSE/HMR 兜底
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }

    # ---- 安全：禁止访问隐藏文件 ----
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}

# ==========================================================
# SSL 注释模板（Let's Encrypt + certbot）
# ==========================================================
#
# 前置：域名已解析到本服务器，80 端口可达。
#
# 1) 获取证书（宿主机 certbot 或 certbot 容器均可，二选一）：
#
#    # 方式 A：宿主机 certbot（推荐简单直接）
#    sudo certbot certonly --webroot -w /var/www/certbot -d your-domain.com \
#        --email you@example.com --agree-tos --no-eff-email
#
#    # 方式 B：certbot 容器
#    docker run --rm -p 80:80 \
#        -v ./docker/nginx/ssl:/etc/letsencrypt \
#        certbot/certbot certonly --standalone -d your-domain.com \
#        --email you@example.com --agree-tos --no-eff-email
#
# 2) 将 docker-compose.prod.yml 中 nginx 的 ssl 卷挂载调整指向证书目录，
#    并把证书路径与下方 443 server 块取消注释、修改 server_name：
#
#    volumes:
#      - ./docker/nginx/ssl:/etc/nginx/ssl:ro
#
# 3) 自动续期（crontab -e）：
#
#    0 3 * * * certbot renew --quiet && docker compose -f /opt/btc-platform/docker-compose.prod.yml exec nginx nginx -s reload
