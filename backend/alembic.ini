# Alembic configuration
# BTC Intelligence Platform

[alembic]
# Migration scripts directory
script_location = migrations

# Template file
file_template = %%(rev)s_%%(slug)s

# Timezone
timezone = UTC

# sqlalchemy.url is set dynamically by env.py from app.core.config (placeholder here)
sqlalchemy.url = postgresql://btc_admin:changeme@localhost:5432/btc_platform

# Version path separator
version_path_separator = os

[post_write_hooks]
# Hooks like ruff format can be configured here

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
