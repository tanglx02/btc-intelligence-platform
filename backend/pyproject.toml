[project]
name = "btc-platform-backend"
version = "0.1.0"
description = "BTC 全市场智能研究平台 - 后端服务"
readme = "../README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "BTC Platform Dev" }]

dependencies = [
    # Web 框架
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "python-multipart>=0.0.12",
    # 数据库与迁移
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    "psycopg2-binary>=2.9.10",
    # 缓存
    "redis>=5.2.0",
    # HTTP 客户端（数据源抓取）
    "httpx>=0.27.2",
    "tenacity>=9.0.0",
    # 配置与校验
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    # 数据处理与计算
    "polars>=1.14.0",
    "numpy>=2.1.0",
    "pandas>=2.2.3",
    # 定时任务
    "apscheduler>=3.10.4",
    # 鉴权与安全
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    # 日志
    "loguru>=0.7.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "httpx>=0.27.2",
    "ruff>=0.7.0",
    "mypy>=1.13.0",
]

[tool.uv]
# 使用 uv 管理依赖与虚拟环境
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
