# ==========================================================
# BTC 全市场智能研究平台 - 生产编排
# 用法:   docker compose -f docker-compose.prod.yml up -d
# 设计:   docs/architecture/21-deployment.md
# 拓扑:   nginx(80/443) -> frontend/backend -> postgres/redis
#         仅 nginx 暴露端口；postgres/redis/backend/frontend 均在内部网络
# ==========================================================

name: btc-platform

services:
  # ===== 数据库（PostgreSQL 16 + TimescaleDB，仅内部网络） =====
  postgres:
    image: timescale/timescaledb:latest-pg16
    container_name: btc_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-btc_platform}
      POSTGRES_USER: ${POSTGRES_USER:-btc_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - backups:/backups
    # 无对外端口；如需本机调试可临时取消注释（仅绑定 127.0.0.1）
    # ports:
    #   - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-btc_admin} -d ${POSTGRES_DB:-btc_platform}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - internal

  # ===== 缓存（Redis 7，requirepass，仅内部网络） =====
  redis:
    image: redis:7-alpine
    container_name: btc_redis
    restart: unless-stopped
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:-changeme}
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --appendonly yes
      --appendfsync everysec
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-changeme}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal

  # ===== API 服务（FastAPI + Uvicorn 多 worker） =====
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: production
    image: btc-platform-backend:latest
    container_name: btc_backend
    restart: unless-stopped
    env_file: .env
    environment:
      - APP_ENV=production
      - DEBUG=false
      # 容器网络内以服务名互联（覆盖 .env 中的 localhost）
      - POSTGRES_HOST=postgres
      - REDIS_HOST=redis
      # 调度与告警由独立 scheduler 容器专职运行，避免多 worker 重复执行/双发
      - SCHEDULER_ENABLED=false
      - ALERT_ENABLED=false
      # 反代后获取真实客户端 IP
      - UVICORN_PROXY_HEADERS=1
      - UVICORN_FORWARDED_ALLOW_IPS=*
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # 无对外端口，由 nginx 反代
    # HEALTHCHECK 由镜像内定义（curl http://localhost:8000/health）
    networks:
      - internal

  # ===== 调度器（与 backend 同镜像，独立入口） =====
  scheduler:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: production
    image: btc-platform-backend:latest
    container_name: btc_scheduler
    restart: unless-stopped
    command: ["python", "-m", "app.scheduler.worker"]
    env_file: .env
    environment:
      - APP_ENV=production
      - DEBUG=false
      - POSTGRES_HOST=postgres
      - REDIS_HOST=redis
      # 专职进程：调度任务 + 告警扫描（backend 进程内已禁用）
      - SCHEDULER_ENABLED=true
      - ALERT_ENABLED=true
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      # 进程存活探针（scheduler 无 HTTP 端点，PID 1 可 signalling 即存活）
      test: ["CMD", "python", "-c", "import os; os.kill(1, 0)"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - internal

  # ===== 前端（Next.js 15 Standalone） =====
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: production
      args:
        # 同源部署：前端经 nginx 访问 API，使用相对路径
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-/api/v1}
    image: btc-platform-frontend:latest
    container_name: btc_frontend
    restart: unless-stopped
    environment:
      - NODE_ENV=production
    depends_on:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:3000/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - internal

  # ===== 反向代理（唯一对外入口） =====
  nginx:
    image: nginx:1.27-alpine
    container_name: btc_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/nginx/conf.d:/etc/nginx/conf.d:ro
      # SSL 证书目录（启用 HTTPS 后放置 fullchain.pem / privkey.pem）
      - ./docker/nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - internal

# ===== 数据卷 =====
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  backups:
    driver: local

# ===== 网络（bridge，仅 nginx 暴露端口到宿主机） =====
networks:
  internal:
    driver: bridge
