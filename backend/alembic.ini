# Alembic 配置文件
# BTC 全市场智能研究平台

[alembic]
# 迁移脚本目录
script_location = migrations

# 模板文件
file_template = %%(rev)s_%%(slug)s

# 时区
timezone = UTC

# sqlalchemy.url 由 env.py 动态从 app.core.config 读取，此处仅作占位
sqlalchemy.url = postgresql://btc_admin:changeme@localhost:5432/btc_platform

# 版本路径分隔符
version_path_separator = os

[post_write_hooks]
# 可在此配置 ruff format 等钩子

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
